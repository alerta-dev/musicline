<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* Video Background */
        #video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        #video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Overlay oscuro */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
            transition: background 0.5s ease;
        }

        .overlay.light {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Container principal */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Logo/Título */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .logo p {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Panel de control */
        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* Input del URL */
        .url-input-container {
            position: relative;
            margin-bottom: 25px;
        }

        .url-input-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 1.2rem;
        }

        #youtube-url {
            width: 100%;
            padding: 18px 20px 18px 55px;
            font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        #youtube-url:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255,107,107,0.3);
        }

        #youtube-url::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* Botón de reproducir */
        .play-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }

        .play-btn:active {
            transform: translateY(0);
        }

        /* Controles adicionales */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .control-btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }

        .control-btn.active {
            background: rgba(255,107,107,0.3);
            border-color: #ff6b6b;
        }

        .control-btn i {
            font-size: 1rem;
        }

        /* Control de volumen */
        .volume-control {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .volume-control i {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .volume-control i:hover {
            color: #fff;
        }

        #volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            outline: none;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            border: none;
        }

        .volume-value {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            min-width: 45px;
            text-align: right;
        }

        /* Control de oscuridad del overlay */
        .overlay-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .overlay-control label {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }

        #overlay-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            outline: none;
            cursor: pointer;
        }

        #overlay-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
        }

        #overlay-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
            border: none;
        }

        /* Estado actual */
        .now-playing {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: none;
        }

        .now-playing.active {
            display: block;
        }

        .now-playing-label {
            color: #ff6b6b;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .now-playing-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Historial */
        .history-section {
            margin-top: 25px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-section::-webkit-scrollbar {
            width: 6px;
        }

        .history-section::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .history-section::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .history-title {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .history-item {
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .history-item i {
            color: #ff6b6b;
        }

        .history-item span {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-item .delete-history {
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .history-item .delete-history:hover {
            color: #ff6b6b;
        }

        /* Mensaje de error */
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Botón de ocultar panel */
        .hide-panel-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .hide-panel-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        /* Panel oculto */
        .control-panel.hidden {
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
        }

        .logo.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Mini controles cuando está oculto */
        .mini-controls {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .mini-controls.show {
            opacity: 1;
            pointer-events: all;
        }

        .mini-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .mini-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .mini-btn.active {
            background: rgba(255,107,107,0.3);
            border-color: #ff6b6b;
        }

        /* Reloj */
        .clock {
            position: fixed;
            top: 30px;
            right: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 1.5rem;
            font-weight: 300;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 2rem;
            }

            .control-panel {
                padding: 25px;
            }

            .controls {
                flex-direction: column;
            }

            .control-btn {
                min-width: 100%;
            }

            .clock {
                font-size: 1.2rem;
                top: 20px;
                right: 20px;
            }
        }

        /* Animación de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .control-panel, .logo {
            animation: fadeInUp 0.8s ease;
        }

        /* Visualizador de audio simple */
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 30px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .audio-visualizer.active {
            opacity: 1;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #ff6b6b, #4ecdc4);
            border-radius: 2px;
            animation: bounce 0.5s ease infinite alternate;
        }

        .bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 15px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }
        .bar:nth-child(6) { height: 20px; animation-delay: 0.2s; }
        .bar:nth-child(7) { height: 15px; animation-delay: 0.1s; }

        @keyframes bounce {
            to {
                height: 30px;
            }
        }

        .audio-visualizer:not(.playing) .bar {
            animation-play-state: paused;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div id="video-background"></div>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>
    
    <!-- Reloj -->
    <div class="clock" id="clock">00:00</div>
    
    <!-- Container Principal -->
    <div class="main-container">
        <div class="logo" id="logo">
            <h1>🎵 Mi Espacio</h1>
            <p>Tu música de fondo personal</p>
        </div>
        
        <div class="control-panel" id="control-panel">
            <!-- Input URL -->
            <div class="url-input-container">
                <i class="fab fa-youtube"></i>
                <input 
                    type="text" 
                    id="youtube-url" 
                    placeholder="Pega aquí el link de YouTube..."
                    autocomplete="off"
                >
            </div>
            
            <!-- Mensaje de error -->
            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i> Por favor, ingresa un link válido de YouTube
            </div>
            
            <!-- Botón Play -->
            <button class="play-btn" id="play-btn">
                <i class="fas fa-play"></i>
                Reproducir
            </button>
            
            <!-- Controles -->
            <div class="controls">
                <button class="control-btn" id="pause-btn">
                    <i class="fas fa-pause"></i>
                    Pausar
                </button>
                <button class="control-btn active" id="loop-btn">
                    <i class="fas fa-redo"></i>
                    Bucle
                </button>
                <button class="control-btn" id="stop-btn">
                    <i class="fas fa-stop"></i>
                    Detener
                </button>
            </div>
            
            <!-- Control de Volumen -->
            <div class="volume-control">
                <i class="fas fa-volume-up" id="volume-icon"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
                <span class="volume-value" id="volume-value">50%</span>
            </div>
            
            <!-- Control de Oscuridad -->
            <div class="overlay-control">
                <label><i class="fas fa-adjust"></i> Oscuridad</label>
                <input type="range" id="overlay-slider" min="0" max="80" value="40">
            </div>
            
            <!-- Visualizador -->
            <div class="audio-visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            
            <!-- Now Playing -->
            <div class="now-playing" id="now-playing">
                <div class="now-playing-label">
                    <i class="fas fa-music"></i> Reproduciendo ahora
                </div>
                <div class="now-playing-title" id="now-playing-title">-</div>
            </div>
            
            <!-- Historial -->
            <div class="history-section" id="history-section">
                <div class="history-title">
                    <i class="fas fa-history"></i> Historial reciente
                </div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
    
    <!-- Mini controles -->
    <div class="mini-controls" id="mini-controls">
        <button class="mini-btn" id="mini-pause">
            <i class="fas fa-pause"></i>
        </button>
        <button class="mini-btn active" id="mini-loop">
            <i class="fas fa-redo"></i>
        </button>
    </div>
    
    <!-- Botón ocultar panel -->
    <button class="hide-panel-btn" id="hide-panel-btn">
        <i class="fas fa-eye"></i>
    </button>

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        // Variables globales
        let player = null;
        let isLoop = true;
        let isPanelHidden = false;
        let isPlaying = false;
        let currentVideoId = null;
        let history = JSON.parse(localStorage.getItem('youtubeHistory')) || [];

        // Función para extraer ID del video
        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // Inicializar YouTube Player
        function onYouTubeIframeAPIReady() {
            console.log('YouTube API Ready');
        }

        function loadVideo(videoId) {
            const container = document.getElementById('video-background');
            
            if (player) {
                player.destroy();
            }
            
            container.innerHTML = '<div id="youtube-player"></div>';
            
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    loop: isLoop ? 1 : 0,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0,
                    showinfo: 0,
                    mute: 0,
                    playlist: isLoop ? videoId : ''
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError
                }
            });
            
            currentVideoId = videoId;
        }

        function onPlayerReady(event) {
            const volume = document.getElementById('volume-slider').value;
            event.target.setVolume(volume);
            event.target.playVideo();
            
            isPlaying = true;
            updatePlayingState();
            
            // Obtener título del video
            fetchVideoTitle(currentVideoId);
            
            // Guardar en historial
            addToHistory(currentVideoId);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                if (isLoop) {
                    player.seekTo(0);
                    player.playVideo();
                }
            }
            
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayingState();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayingState();
            }
        }

        function onPlayerError(event) {
            console.error('Error del reproductor:', event.data);
            showError('Error al reproducir el video. Verifica el link.');
        }

        function updatePlayingState() {
            const visualizer = document.getElementById('visualizer');
            const pauseBtn = document.getElementById('pause-btn');
            const miniPause = document.getElementById('mini-pause');
            
            if (isPlaying) {
                visualizer.classList.add('active', 'playing');
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i> Pausar';
                miniPause.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                visualizer.classList.remove('playing');
                pauseBtn.innerHTML = '<i class="fas fa-play"></i> Reanudar';
                miniPause.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // Obtener título del video
        async function fetchVideoTitle(videoId) {
            try {
                // Usando noembed como alternativa gratuita
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                const data = await response.json();
                
                if (data.title) {
                    document.getElementById('now-playing-title').textContent = data.title;
                    document.getElementById('now-playing').classList.add('active');
                }
            } catch (error) {
                document.getElementById('now-playing-title').textContent = `Video ID: ${videoId}`;
                document.getElementById('now-playing').classList.add('active');
            }
        }

        // Historial
        function addToHistory(videoId) {
            // Evitar duplicados
            history = history.filter(item => item.id !== videoId);
            
            history.unshift({
                id: videoId,
                date: new Date().toISOString()
            });
            
            // Mantener solo los últimos 10
            history = history.slice(0, 10);
            
            localStorage.setItem('youtubeHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <i class="fas fa-play-circle"></i>
                    <span>youtube.com/watch?v=${item.id}</span>
                    <i class="fas fa-times delete-history" data-index="${index}"></i>
                `;
                
                div.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('delete-history')) {
                        document.getElementById('youtube-url').value = `https://www.youtube.com/watch?v=${item.id}`;
                        loadVideo(item.id);
                    }
                });
                
                container.appendChild(div);
            });
            
            // Eventos para eliminar
            document.querySelectorAll('.delete-history').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(e.target.dataset.index);
                    history.splice(index, 1);
                    localStorage.setItem('youtubeHistory', JSON.stringify(history));
                    renderHistory();
                });
            });
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 3000);
        }

        // Event Listeners
        document.getElementById('play-btn').addEventListener('click', () => {
            const url = document.getElementById('youtube-url').value.trim();
            const videoId = extractVideoId(url);
            
            if (videoId) {
                document.getElementById('error-message').classList.remove('show');
                loadVideo(videoId);
            } else {
                showError('Por favor, ingresa un link válido de YouTube');
            }
        });

        document.getElementById('youtube-url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('play-btn').click();
            }
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            if (player) {
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }
        });

        document.getElementById('mini-pause').addEventListener('click', () => {
            if (player) {
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }
        });

        document.getElementById('loop-btn').addEventListener('click', function() {
            isLoop = !isLoop;
            this.classList.toggle('active', isLoop);
            document.getElementById('mini-loop').classList.toggle('active', isLoop);
            
            if (player && currentVideoId) {
                // Recargar con nueva configuración de loop
                const currentTime = player.getCurrentTime();
                loadVideo(currentVideoId);
                setTimeout(() => {
                    if (player) player.seekTo(currentTime);
                }, 1000);
            }
        });

        document.getElementById('mini-loop').addEventListener('click', () => {
            document.getElementById('loop-btn').click();
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            if (player) {
                player.stopVideo();
                isPlaying = false;
                updatePlayingState();
                document.getElementById('visualizer').classList.remove('active');
                document.getElementById('now-playing').classList.remove('active');
            }
        });

        document.getElementById('volume-slider').addEventListener('input', function() {
            const volume = this.value;
            document.getElementById('volume-value').textContent = volume + '%';
            
            const icon = document.getElementById('volume-icon');
            if (volume == 0) {
                icon.className = 'fas fa-volume-mute';
            } else if (volume < 50) {
                icon.className = 'fas fa-volume-down';
            } else {
                icon.className = 'fas fa-volume-up';
            }
            
            if (player) {
                player.setVolume(volume);
            }
        });

        document.getElementById('volume-icon').addEventListener('click', () => {
            const slider = document.getElementById('volume-slider');
            if (slider.value > 0) {
                slider.dataset.previousVolume = slider.value;
                slider.value = 0;
            } else {
                slider.value = slider.dataset.previousVolume || 50;
            }
            slider.dispatchEvent(new Event('input'));
        });

        document.getElementById('overlay-slider').addEventListener('input', function() {
            const opacity = this.value / 100;
            document.getElementById('overlay').style.background = `rgba(0, 0, 0, ${opacity})`;
        });

        document.getElementById('hide-panel-btn').addEventListener('click', function() {
            isPanelHidden = !isPanelHidden;
            
            document.getElementById('control-panel').classList.toggle('hidden', isPanelHidden);
            document.getElementById('logo').classList.toggle('hidden', isPanelHidden);
            document.getElementById('mini-controls').classList.toggle('show', isPanelHidden);
            
            this.innerHTML = isPanelHidden 
                ? '<i class="fas fa-eye-slash"></i>' 
                : '<i class="fas fa-eye"></i>';
        });

        // Reloj
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        
        setInterval(updateClock, 1000);
        updateClock();

        // Inicializar historial
        renderHistory();

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    document.getElementById('pause-btn').click();
                    break;
                case 'KeyM':
                    document.getElementById('volume-icon').click();
                    break;
                case 'KeyH':
                    document.getElementById('hide-panel-btn').click();
                    break;
                case 'KeyL':
                    document.getElementById('loop-btn').click();
                    break;
            }
        });
    </script>
</body>
</html>
